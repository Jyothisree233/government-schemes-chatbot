<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account — SchemeAI</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=14">
</head>
<body class="auth-page">
    <!-- Ambient Background Blobs -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Side-by-Side Auth Container (Panel 3) -->
    <div class="auth-split-layout">
        <!-- Left: 3D Robot with "Let's get started!" Speech Bubble -->
        <div class="auth-robot-col">
            <div class="auth-robot-speech-bubble">Let's get started!</div>
            <img src="{{ url_for('static', filename='images/robot_mascot.png') }}?v=14" alt="SchemeAI Robot" class="auth-robot-mascot-img">
        </div>

        <!-- Right: Clean White Elevated Card -->
        <div class="auth-card">
            <!-- Brand -->
            <a href="/" class="auth-brand" style="justify-content: flex-start; margin-bottom: 1.25rem;">
                <div class="brand-logo" style="width: 38px; height: 38px; border-radius: 10px;">
                    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="SchemeAI Logo" class="brand-logo-img">
                </div>
                <span class="brand-name" style="font-size: 1.35rem;">Scheme<span>AI</span></span>
            </a>

            <h2 style="text-align: left; margin-bottom: 0.35rem;">Create Your Account</h2>
            <p class="auth-subtitle" style="text-align: left; margin-bottom: 1.5rem;">
                Join SchemeAI to get personalized scheme recommendations.
            </p>

            <!-- Alerts & Flash Messages -->
            {% if error %}
            <div class="auth-alert error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon-left"></i>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope input-icon-left"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-id-badge input-icon-left"></i>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon-left"></i>
                        <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', 'toggleIcon')" title="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; border-radius: var(--radius-md); margin-top: 0.5rem;">
                    <span>Register</span>
                    <i class="fa-solid fa-arrow-right" style="margin-left: 0.4rem;"></i>
                </button>
            </form>

            <div class="auth-footer" style="text-align: center; margin-top: 1.5rem;">
                <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
            </div>
        </div>
    </div>

    <!-- Password Visibility Toggle Script -->
    <script>
        function togglePasswordVisibility(fieldId, iconId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
