<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SchemeAI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="page-container" style="justify-content: center; align-items: center; min-height: 100vh;">

        <div class="auth-container">

            <!-- Brand -->
            <div class="auth-brand" onclick="window.location.href='/'">
                <div class="brand-logo">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <span class="brand-name">Scheme<span>AI</span></span>
            </div>

            <!-- Forgot Password Card -->
            <div class="auth-card">

                <h2>Forgot Password?</h2>

                <p class="auth-subtitle">
                    Enter your registered email to receive a password reset link.
                </p>

                <!-- Error Message -->
                {% if error %}
                <div class="auth-alert error">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
                </div>
                {% endif %}

                <!-- Success Message -->
                {% if success_msg %}
                <div class="auth-alert success">
                    <i class="fa-solid fa-circle-check"></i> {{ success_msg }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('forgot_password') }}">

                    <div class="form-group">
                        <label for="email">Registered Email</label>

                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your registered email"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        <span>Send Reset Link</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                </form>

                <div class="auth-footer">
                    <p>
                        Remember your password?
                        <a href="{{ url_for('login') }}">Back to Login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
