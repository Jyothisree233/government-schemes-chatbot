<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — SchemeAI</title>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=14">
</head>
<body class="auth-page">

    <!-- Ambient Gradient Blobs -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="auth-container">

        <!-- SchemeAI Brand Logo -->
        <a href="/" class="auth-brand">
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="SchemeAI Logo" class="brand-logo-img">
            </div>
            <span class="brand-name">Scheme<span>AI</span></span>
        </a>

        <!-- Forgot Password Card -->
        <div class="auth-card">

            <!-- Decorative 3D Robot Avatar -->
            <div class="auth-robot-badge">
                <img src="{{ url_for('static', filename='images/robot_mascot.jpg') }}?v=3" alt="SchemeAI Robot Assistant">
            </div>

            <h2>Forgot Password?</h2>
            <p class="auth-subtitle">Enter your registered email address and we'll send you a password reset link.</p>

            <!-- Alerts & Flash Messages -->
            {% if error %}
            <div class="auth-alert error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if success_msg %}
            <div class="auth-alert success">
                <i class="fa-solid fa-circle-check"></i>
                <span>{{ success_msg }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="email">Registered Email</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope input-icon-left"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your registered email" required autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-gradient" style="width: 100%; margin-top: 1rem;">
                    <span>Send Reset Link</span>
                    <i class="fa-solid fa-paper-plane" style="margin-left: 0.5rem;"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>

        </div>

    </div>

</body>
</html>
