<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchemeAI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="page-container" style="justify-content: center; align-items: center; min-height: 100vh;">
        <!-- Card layout centering -->
        <div class="auth-container">
            <div class="auth-brand" onclick="window.location.href='/'">
                <div class="brand-logo">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <span class="brand-name">Scheme<span>AI</span></span>
            </div>
            
            <div class="auth-card">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Login to access SchemeAI recommendation engine.</p>
                
                <!-- Notifications -->
                {% if error %}
                <div class="auth-alert error">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
                </div>
                {% endif %}

                {% if success_msg %}
                <div class="auth-alert success">
                    <i class="fa-solid fa-circle-check"></i> {{ success_msg }}
                </div>
                {% endif %}
                
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <div style="text-align: right; margin-top: 0.5rem;">
                        <a href="{{ url_for('forgot_password') }}" 
                        style="color: #4f46e5; text-decoration: none; font-size: 0.9rem;">
                        Forgot Password?
                        </a>
                        </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        <span>Log In</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
